services:
  # ---------------- Source Database ----------------

  source:
    image: postgres:16
    container_name: source_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: source_postgres
      POSTGRES_PASSWORD: sourcepostgres
      POSTGRES_DB: source

    ports:
      - "5437:5432"

    volumes:
      - source_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_postgres -d source"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - pipeline_network


  # ---------------- Destination Database ----------------

  destination:
    image: postgres:16
    container_name: destination_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: destination_postgres
      POSTGRES_PASSWORD: destinationpostgres
      POSTGRES_DB: destination

    ports:
      - "5434:5432"

    volumes:
      - destination_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U destination_postgres -d destination"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - pipeline_network


  # ---------------- Data Initialization ----------------

  data_init:
    build:
      context: "./workers/data init"
      dockerfile: Dockerfile

    image: data_init:latest
    container_name: data_init
    restart: "no"

    environment:
      SOURCE_DATABASE_URL: postgresql+psycopg2://source_postgres:sourcepostgres@source:5432/source
      DESTINATION_DATABASE_URL: postgresql+psycopg2://destination_postgres:destinationpostgres@destination:5432/destination

    depends_on:
      source:
        condition: service_healthy

      destination:
        condition: service_healthy

    networks:
      - pipeline_network


  # ---------------- Airflow Database ----------------

  airflow_db:
    image: postgres:16
    container_name: airflow_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - pipeline_network


  # ---------------- Airflow Initialization ----------------

  airflow_init:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    image: custom_airflow:latest
    container_name: airflow_init

    depends_on:
      airflow_db:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    entrypoint: /bin/bash

    command:
      - -c
      - |
        set -e

        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname admin \
          --lastname admin \
          --role Admin \
          --email admin@example.com || true

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

    networks:
      - pipeline_network


  # ---------------- Airflow Webserver ----------------

  airflow_webserver:
    image: custom_airflow:latest
    container_name: airflow_webserver
    restart: unless-stopped

    depends_on:
      airflow_init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    ports:
      - "8080:8080"

    command: webserver

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - pipeline_network


  # ---------------- Airflow Scheduler ----------------

  airflow_scheduler:
    image: custom_airflow:latest
    container_name: airflow_scheduler
    restart: unless-stopped

    depends_on:
      airflow_init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    command: scheduler

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - pipeline_network


# ---------------- Named Volumes ----------------

volumes:
  source_data:
  destination_data:
  airflow_db_data:
  airflow_logs:


# ---------------- Docker Network ----------------

networks:
  pipeline_network:
    name: dagster-vs-airflow-network